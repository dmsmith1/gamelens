spring.application.name=GameLens
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gamelens}
spring.datasource.username=${POSTGRES_USER:gamelens}
spring.datasource.password=${POSTGRES_PASSWORD:gamelens_local_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
