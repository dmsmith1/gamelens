services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamelens}
      POSTGRES_USER: ${POSTGRES_USER:-gamelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamelens_local_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-gamelens}
      POSTGRES_USER: ${POSTGRES_USER:-gamelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamelens_local_only}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      database: {condition: service_healthy}
  ai:
    build: ./ai
    ports: ["127.0.0.1:8000:8000"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:4200:80"]
    depends_on: [backend, ai]
volumes:
  postgres_data:
